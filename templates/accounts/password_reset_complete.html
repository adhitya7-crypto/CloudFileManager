{% extends 'base.html' %}

{% block content %}

<style>
    .success-container {
        min-height: 75vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .success-card {
        width: 420px;
        padding: 40px;
        background: white;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    }

    .success-icon {
        font-size: 60px;
        margin-bottom: 15px;
    }

    .success-card h2 {
        color: #111827;
        margin-bottom: 15px;
    }

    .success-card p {
        color: #6b7280;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    .login-btn {
        display: inline-block;
        padding: 12px 25px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 8px;
    }

    .login-btn:hover {
        background: #1d4ed8;
    }
</style>

<div class="success-container">
    <div class="success-card">

        <div class="success-icon">✅</div>

        <h2>Password Changed!</h2>

        <p>
            Your password has been reset successfully.
            You can now log in using your new password.
        </p>

        <a href="{% url 'login' %}" class="login-btn">
            Login Now
        </a>

    </div>
</div>

{% endblock %}
