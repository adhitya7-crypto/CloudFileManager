<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Files | Cloud File Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #1f2937;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            background: #111827;
            position: fixed;
            padding: 30px 20px;
            color: white;
        }

        .sidebar h2 {
            color: #60a5fa;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            padding: 14px;
            margin-bottom: 12px;
            color: #d1d5db;
            text-decoration: none;
            border-radius: 8px;
        }

        .sidebar a:hover,
        .sidebar .active {
            background: #2563eb;
            color: white;
        }

        .main {
            margin-left: 240px;
            padding: 40px;
        }

        .upload-box {
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        h1 {
            margin-bottom: 12px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .file-input {
            border: 2px dashed #93c5fd;
            padding: 45px 20px;
            border-radius: 12px;
            text-align: center;
            background: #eff6ff;
            margin-bottom: 25px;
        }

        input[type="file"] {
            margin-top: 20px;
            max-width: 100%;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        @media(max-width: 700px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main {
                margin-left: 0;
                padding: 20px;
            }

            .upload-box {
                margin: 20px auto;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>☁ Cloud Manager</h2>

        <a href="{% url 'dashboard' %}">🏠 Dashboard</a>
        <a href="{% url 'file_list' %}">📁 My Files</a>
        <a href="{% url 'upload' %}" class="active">⬆ Upload Files</a>
    </div>

    <div class="main">

        <div class="upload-box">

            <h1>Upload Your Files</h1>

            <p class="description">
                Select a file from your computer and upload it securely.
            </p>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="file-input">
                    <h3>📂 Choose Your File</h3>
                    <p>Select a file to upload</p>

                    <input
                        type="file"
                        name="file"
                        id="file"
                        required
                    >
                </div>

                <button type="submit">
                    Upload File
                </button>

            </form>

        </div>

    </div>

</body>
</html>
