{% extends 'base.html' %}

{% block content %}

<style>
    .reset-container {
        min-height: 75vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .reset-card {
        width: 420px;
        padding: 40px;
        background: white;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    }

    .success-icon {
        font-size: 55px;
        margin-bottom: 15px;
    }

    .reset-card h2 {
        margin-bottom: 15px;
        color: #111827;
    }

    .reset-card p {
        color: #6b7280;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    .login-btn {
        display: inline-block;
        padding: 12px 25px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 8px;
    }

    .login-btn:hover {
        background: #1d4ed8;
    }
</style>

<div class="reset-container">
    <div class="reset-card">

        <div class="success-icon">📩</div>

        <h2>Check Your Email</h2>

        <p>
            If an account exists with the email address you entered,
            password reset instructions have been sent.
        </p>

        <a href="{% url 'login' %}" class="login-btn">
            Back to Login
        </a>

    </div>
</div>

{% endblock %}
